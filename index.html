<body>
  <div class="card">
    <div class="icon-box">
      <svg viewBox="0 0 24 24"><path d="M4 4h10a2 2 0 0 1 2 2v2.5l4-2.5v12l-4-2.5V18a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>
    </div>
    <h2>Raj VidGen</h2>
    <div class="subtitle">AI Video Studio · Gold Mobile Edition</div>
    
    <div class="spinner" id="spinner"></div>
    <div id="msg">Connecting to your Laptop...</div>
    <div id="btnArea"></div>

    <div class="badge">
      <span class="badge-dot"></span>
      <span>Auto-Syncing with Laptop</span>
    </div>
  </div>

  <script>
    const BUCKET = "UsKKd7HDHYSXV25st69Z6w";
    let attempts = 0;

    async function checkTunnel() {
      try {
        const res = await fetch("https://kvdb.io/" + BUCKET + "/tunnel_url?t=" + Date.now());
        if (res.ok) {
          const url = (await res.text()).trim();
          if (url && url.startsWith("https://") && url.includes(".trycloudflare.com")) {
            document.getElementById("spinner").style.display = "none";
            document.getElementById("msg").innerHTML = "<span style='color:#FFD700; font-weight:700;'>Connected! Opening Raj VidGen...</span>";
            document.getElementById("btnArea").innerHTML = `<a href="${url}" class="btn">Click Here to Open</a>`;
            window.location.replace(url);
            return;
          }
        }
      } catch (err) {}

      attempts++;
      document.getElementById("msg").innerHTML = `<span style='color:#FFD700;'>Laptop connect ho raha hai...<br><small style="color:#C5BCA8;">(Retrying ${attempts})</small></span>`;
      setTimeout(checkTunnel, 2500);
    }

    checkTunnel();
  </script>
