<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Frameloom Mobile Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 20%, #161e2e 0%, #0a0d14 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: rgba(22, 27, 34, 0.85);
      border: 1px solid rgba(48, 54, 61, 0.8);
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 390px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(16, 185, 129, 0.1);
      backdrop-filter: blur(12px);
    }
    .icon-box {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(16,185,129,0.2) 0%, rgba(59,130,246,0.1) 100%);
      border: 1.5px solid rgba(16,185,129,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 20px;
      box-shadow: 0 0 25px rgba(16,185,129,0.2);
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3.5px solid rgba(16,185,129,0.15);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 16px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    h2 {
      font-size: 21px;
      color: #fff;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .subtitle {
      font-size: 13px;
      color: #8b949e;
      margin-top: 4px;
      margin-bottom: 20px;
    }
    #msg {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 28px;
      border-radius: 999px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #04241c;
      font-weight: 700;
      text-decoration: none;
      font-size: 14.5px;
      box-shadow: 0 4px 18px rgba(16,185,129,0.4);
      transition: transform 0.15s ease;
    }
    .btn:active { transform: scale(0.97); }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 24px;
      font-size: 11.5px;
      color: #64748b;
      background: rgba(255,255,255,0.04);
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">🎬</div>
    <h2>Frameloom Studio</h2>
    <div class="subtitle">24/7 Mobile Remote Access</div>
    
    <div class="spinner" id="spinner"></div>
    <div id="msg">Connecting to your Laptop...</div>
    <div id="btnArea"></div>

    <div class="badge">
      <span class="badge-dot"></span>
      <span>Auto-Syncing with Laptop</span>
    </div>
  </div>

  <script>
    const BUCKET = "UsKKd7HDHYSXV25st69Z6w";
    let attempts = 0;

    async function checkTunnel() {
      try {
        const res = await fetch("https://kvdb.io/" + BUCKET + "/tunnel_url?t=" + Date.now());
        if (res.ok) {
          const url = (await res.text()).trim();
          if (url && url.startsWith("https://") && url.includes(".trycloudflare.com")) {
            document.getElementById("spinner").style.display = "none";
            document.getElementById("msg").innerHTML = "<span style='color:#10b981; font-weight:600;'>Connected! Opening Studio...</span>";
            document.getElementById("btnArea").innerHTML = `<a href="${url}" class="btn">Click Here to Open</a>`;
            window.location.replace(url);
            return;
          }
        }
      } catch (err) {}

      attempts++;
      document.getElementById("msg").innerHTML = `<span style='color:#f59e0b;'>Laptop connect ho raha hai...<br><small style="color:#64748b;">(Retrying ${attempts})</small></span>`;
      setTimeout(checkTunnel, 2500);
    }

    checkTunnel();
  </script>
</body>
</html>
